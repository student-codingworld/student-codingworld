<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Pawan Patel - Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#12263f"/>
      <stop offset="100%" stop-color="#0e3b4f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36bcf7"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#36bcf7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#36bcf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- floating glows -->
    <circle cx="150" cy="60" r="190" fill="url(#glow1)">
      <animate attributeName="cx" values="150;260;150" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;110;60" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="230" r="210" fill="url(#glow2)">
      <animate attributeName="cx" values="860;740;860" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;170;230" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- code-bracket decoration -->
    <text x="780" y="170" font-family="Consolas, 'Courier New', monospace" font-size="150" fill="#ffffff" fill-opacity="0.05">&lt;/&gt;</text>

    <!-- top label -->
    <text x="70" y="70" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#36bcf7" letter-spacing="3">
      &gt; HELLO, WORLD
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <!-- name -->
    <text x="70" y="138" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="1">
      Pawan Patel
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>

    <!-- animated underline -->
    <rect x="70" y="155" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" values="0;260" dur="1.6s" fill="freeze"/>
    </rect>

    <!-- role -->
    <text x="70" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#cfe3f5">
      Full-Stack Developer  ·  Founder &amp; MD @ CodeAxis
      <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
    </text>

    <!-- tags -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#ffffff">
      <rect x="70" y="222" width="70" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#36bcf7" stroke-opacity="0.6"/>
      <text x="88" y="241">PHP</text>
      <rect x="150" y="222" width="92" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#36bcf7" stroke-opacity="0.6"/>
      <text x="168" y="241">Python</text>
      <rect x="252" y="222" width="86" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#36bcf7" stroke-opacity="0.6"/>
      <text x="270" y="241">Django</text>
      <rect x="348" y="222" width="116" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#36bcf7" stroke-opacity="0.6"/>
      <text x="366" y="241">JavaScript</text>
      <rect x="474" y="222" width="80" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#36bcf7" stroke-opacity="0.6"/>
      <text x="492" y="241">MySQL</text>
    </g>

    <!-- blinking cursor -->
    <rect x="900" y="60" width="12" height="22" fill="#36bcf7">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
